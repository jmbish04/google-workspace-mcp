[project]
name = "gws-ingest"
version = "0.1.0"
description = "Polls Gmail through the Worker, applies routing rules, embeds mail and attachment text into Postgres (schema gws)."
requires-python = ">=3.11"
dependencies = [
  "psycopg[binary,pool]>=3.2",
  "httpx>=0.27",
  "fastapi>=0.115",
  "uvicorn>=0.30",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
