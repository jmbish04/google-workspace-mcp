<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="utf-8">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/babel-standalone@6/babel.min.js"></script>
  <style>
    html, body { height: 100%; margin: 0; }
    @keyframes shimmer { 0%{opacity:.4} 50%{opacity:1} 100%{opacity:.4} }
    .shimmer { animation: shimmer 1.4s ease-in-out infinite; }
  </style>
</head>
<body class="bg-zinc-950 text-zinc-100 font-sans">
  <!-- Injected server-side from Script Properties (see Code.gs) — never hardcoded. -->
  <script>
    window.__COPILOT__ = { workerUrl: "<?= workerUrl ?>", token: "<?= token ?>" };
  </script>
  <div id="root" class="h-full"></div>
  <script type="text/babel">
    const { useState, useRef, useEffect } = React;
    const CFG = window.__COPILOT__;

    function Bubble({ role, content }) {
      const mine = role === "user";
      return (
        <div className={`max-w-[92%] rounded-2xl px-3 py-2 text-sm leading-relaxed whitespace-pre-wrap break-words ${mine ? "ml-auto bg-blue-600 text-white" : "mr-auto bg-zinc-900 border border-zinc-800"}`}>
          {content}
        </div>
      );
    }

    function ChatCopilot() {
      const [input, setInput] = useState("");
      const [messages, setMessages] = useState([]);
      const [busy, setBusy] = useState(false);
      const [error, setError] = useState("");
      const endRef = useRef(null);

      useEffect(() => { endRef.current && endRef.current.scrollIntoView({ behavior: "smooth" }); }, [messages, busy]);

      async function send() {
        const text = input.trim();
        if (!text || busy) return;
        const next = [...messages, { role: "user", content: text }];
        setMessages(next); setInput(""); setBusy(true); setError("");
        try {
          const res = await fetch(CFG.workerUrl + "/api/copilot/chat", {
            method: "POST",
            headers: { "Content-Type": "application/json", "Authorization": "Bearer " + CFG.token },
            body: JSON.stringify({ messages: next }),
          });
          const data = await res.json();
          if (!res.ok) throw new Error(data && data.error ? data.error : ("HTTP " + res.status));
          setMessages([...next, { role: "assistant", content: data.reply || "(no reply)" }]);
        } catch (e) {
          setError(String(e && e.message ? e.message : e));
        } finally {
          setBusy(false);
        }
      }

      return (
        <div className="flex flex-col h-screen p-3">
          <div className="text-xs font-semibold text-zinc-400 pb-2">AI Copilot · Google Workspace</div>
          <div className="flex-1 overflow-y-auto space-y-3 pr-1">
            {messages.length === 0 && (
              <div className="text-xs text-zinc-500 mt-6 text-center">Ask me to search mail, edit this doc, build a sheet, schedule an event…</div>
            )}
            {messages.map((m, i) => <Bubble key={i} role={m.role} content={m.content} />)}
            {busy && <div className="mr-auto text-xs text-zinc-400 shimmer px-1">Thinking…</div>}
            {error && <div className="mr-auto text-xs text-red-400 border border-red-900/50 bg-red-950/40 rounded-lg px-3 py-2">{error}</div>}
            <div ref={endRef} />
          </div>
          <div className="flex gap-2 pt-3">
            <input
              className="flex-1 bg-zinc-900 border border-zinc-800 rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-1 focus:ring-blue-600 disabled:opacity-50"
              value={input}
              disabled={busy}
              onChange={(e) => setInput(e.target.value)}
              onKeyDown={(e) => e.key === "Enter" && send()}
              placeholder="Ask copilot…"
            />
            <button
              className="bg-blue-600 hover:bg-blue-500 disabled:opacity-50 text-white px-4 py-2 rounded-xl text-sm font-medium"
              disabled={busy}
              onClick={send}
            >Send</button>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<ChatCopilot />);
  </script>
</body>
</html>
