name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# This Worker is a pnpm + Astro (Cloudflare) app. (The legacy npm/keytar
# `workspace-server` CI was replaced when the repo became a Worker.)
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - name: Use Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        # tools.ts is a very large single-file tool catalog; the type checker
        # needs a bigger V8 stack than the default to walk it without a
        # RangeError (stack overflow). Routed through the `typecheck` script so
        # local and CI use the same stack size.
        run: pnpm run typecheck

      - name: Tests
        run: pnpm exec vitest run

      - name: Build
        run: pnpm build
